apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-fsd-backend
  namespace: hello-fsd
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-fsd-backend
  namespace: hello-fsd
  labels:
    app.kubernetes.io/name: hello-fsd-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-fsd-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-fsd-backend
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: hello-fsd-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello-fsd-backend
      initContainers:
        # Spring Boot will retry its own datasource connection, but failing
        # fast here gives a clearer signal in `kubectl get pods` while
        # Postgres is still starting up on a fresh cluster.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h hello-fsd-postgres -p 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: backend
          # Replace with your registry path; the pipeline overwrites this tag per build.
          image: ghcr.io/sriindus/hello-fsd-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hello-fsd-config
            - secretRef:
                name: hello-fsd-db-credentials
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hello-fsd-backend
  namespace: hello-fsd
  labels:
    app.kubernetes.io/name: hello-fsd-backend
spec:
  selector:
    app.kubernetes.io/name: hello-fsd-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-fsd-backend
  namespace: hello-fsd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-fsd-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
