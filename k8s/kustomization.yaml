apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-fsd

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml

# includeSelectors keeps these in each Deployment's matchLabels, matching
# what the deprecated commonLabels did. It must stay true: spec.selector is
# immutable, so flipping it would break `kubectl apply` against an
# already-deployed cluster.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: hello-fsd
      app.kubernetes.io/managed-by: kustomize

# `kustomize edit set image` in the pipeline rewrites these per build.
images:
  - name: ghcr.io/sriindus/hello-fsd-backend
    newTag: latest
  - name: ghcr.io/sriindus/hello-fsd-frontend
    newTag: latest
