# Demo-only credentials matching docker-compose's defaults, so this project
# runs out of the box. For anything beyond a hello-world demo, generate this
# with `kubectl create secret generic ... --dry-run=client -o yaml`, a sealed
# secret, or an external secret manager (Vault, AWS/GCP secret manager) --
# never hand-edit real credentials into a file that gets committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: hello-fsd-db-credentials
  namespace: hello-fsd
type: Opaque
stringData:
  DB_USER: hellofsd
  DB_PASSWORD: hellofsd
  POSTGRES_DB: hellofsd
