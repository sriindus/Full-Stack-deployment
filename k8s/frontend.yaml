apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-fsd-frontend
  namespace: hello-fsd
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-fsd-frontend
  namespace: hello-fsd
  labels:
    app.kubernetes.io/name: hello-fsd-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-fsd-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-fsd-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: hello-fsd-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello-fsd-frontend
      containers:
        - name: web
          # Replace with your registry path; the pipeline overwrites this tag per build.
          image: ghcr.io/sriindus/hello-fsd-frontend:latest
          imagePullPolicy: IfNotPresent
          # This image must be built with
          # --build-arg BACKEND_UPSTREAM=hello-fsd-backend:8080
          # (the Jenkinsfile does this) so nginx's /api/ fallback proxy
          # points at the in-cluster backend Service; see the frontend
          # Dockerfile and nginx.conf.template.
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hello-fsd-frontend
  namespace: hello-fsd
  labels:
    app.kubernetes.io/name: hello-fsd-frontend
spec:
  selector:
    app.kubernetes.io/name: hello-fsd-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-fsd-frontend
  namespace: hello-fsd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-fsd-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
